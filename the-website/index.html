
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edinburgh Environmental Dashboard</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>Edinburgh Environmental Dashboard</h2>
    <p>Exploring green spaces, traffic, and air quality</p>
</header>

<div class="dashboard">

    <aside class="sidebar">
        <h3>Explore the Data</h3>
        <p>Explore environmental conditions across Edinburgh.</p>

        <h4>Map Layers</h4>
        <label>
            <input type="checkbox" id="greenspaces-toggle" checked>
            Green Spaces
        </label>

        <label>
            <input type="checkbox" id="traffic-toggle" checked>
            Traffic
        </label>

        <h4>Summary Statistics</h4>
        <div class="stats">
            <div class="stat-card">
                <small>Green Spaces</small>
                <h2 id="greenspace-count">—</h2>
            </div>

            <div class="stat-card">
                <small>Traffic Features</small>
                <h2 id="traffic-count">—</h2>
            </div>
        </div>

        <h4>Selected Feature</h4>
        <div id="feature-info">
            Click a feature on the map to see its details.
        </div>
    </aside>

    <main id="map"></main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/map.js"></script>

</body>
</html>
